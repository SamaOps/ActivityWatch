name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  validate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check TRACKER_VERSION matches release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION=$(grep -oP 'TRACKER_VERSION\s*=\s*["'"'"']\K[^"'"'"']+' activity_tracker.py)

          echo "Release tag : $TAG"
          echo "TRACKER_VERSION: $VERSION"

          if [ "$VERSION" != "$TAG" ]; then
            echo "ERROR: TRACKER_VERSION in activity_tracker.py ($VERSION) does not match release tag ($TAG)."
            echo "Bump TRACKER_VERSION before tagging the release."
            exit 1
          fi

          echo "Version check passed."

      - name: Upload clean placeholder assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            activity_tracker.py
            install_windows.bat
            install_ubuntu_mac.sh

      - name: Notify server to refresh its cache
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          curl -fsS -X POST "http://16.171.17.163:8000/tracker/refresh" \
            -H "X-Refresh-Token: ${REFRESH_TOKEN}" \
            || echo "Refresh call failed (non-fatal) — server will still pick it up on next restart."
