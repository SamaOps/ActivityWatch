name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check TRACKER_VERSION matches release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION=$(grep -oP 'TRACKER_VERSION\s*=\s*["'"'"']\K[^"'"'"']+' activity_tracker.py)

          echo "Release tag : $TAG"
          echo "TRACKER_VERSION: $VERSION"

          if [ "$VERSION" != "$TAG" ]; then
            echo "ERROR: TRACKER_VERSION in activity_tracker.py ($VERSION) does not match release tag ($TAG)."
            echo "Bump TRACKER_VERSION before tagging the release."
            exit 1
          fi

          echo "Version check passed."

      - name: Inject write key into tracker
        env:
          WKEY: ${{ secrets.TRACKER_WRITE_KEY }}
        run: |
          sed -i "s|__INJECT_TRACKER_WRITE_KEY__|${WKEY}|" activity_tracker.py

      - name: Upload .py and installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            activity_tracker.py
            install_windows.bat
            install_ubuntu_mac.sh

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inject write key into tracker
        env:
          WKEY: ${{ secrets.TRACKER_WRITE_KEY }}
        run: |
          (Get-Content activity_tracker.py) -replace '__INJECT_TRACKER_WRITE_KEY__', $env:WKEY | Set-Content activity_tracker.py

      - name: Build exe
        run: |
          pip install pyinstaller requests
          pyinstaller --onefile --noconsole --name activity_tracker activity_tracker.py

      - name: Upload exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/activity_tracker.exe
