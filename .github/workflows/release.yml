name: Release

on:
  release:
    types: [published]

jobs:
  validate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check TRACKER_VERSION matches release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION=$(grep -oP 'TRACKER_VERSION\s*=\s*["'"'"']\K[^"'"'"']+' activity_tracker.py)

          echo "Release tag : $TAG"
          echo "TRACKER_VERSION: $VERSION"

          if [ "$VERSION" != "$TAG" ]; then
            echo "ERROR: TRACKER_VERSION in activity_tracker.py ($VERSION) does not match release tag ($TAG)."
            echo "Bump TRACKER_VERSION before tagging the release."
            exit 1
          fi

          echo "Version check passed."

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            activity_tracker.py
            install_windows.bat
